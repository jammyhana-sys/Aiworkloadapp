function gate(h){$('#nav').classList.add('hide');$$('main>section').forEach(s=>s.classList.add('hide'));let g=$('#gate');if(!g){g=document.createElement('section');g.id='gate';$('main').appendChild(g)}g.innerHTML=`<div class="card" style="text-align:center;padding:34px 18px">${h}</div>`}
async function loadAll(){

  const [E,R,N,C]=await Promise.all([all('promo_employees'),all('promo_reqs'),all('promo_nominations'),all('promo_config')]);
  db.emps=E.map(r=>r.data);db.reqs=R.map(r=>r.data);db.noms=N.map(r=>({...r.data,id:r.id,empId:r.emp_id,status:r.status,step:r.step||0}));await loadFlow();
  {const od=await sb.rpc('promo_orders_for_me');db.orders=od.error?C.filter(x=>/^order:/.test(x.k)).map(x=>x.data):(od.data||[]);db.orders.forEach(applyOrder)}const cf=C.find(x=>x.k==='cfg'),im=C.find(x=>x.k==='imported');db.cfg={...DEF,...(cf?cf.data:{})};db.imported=im?im.data:null;
}
async function boot(){

    await loadAll();READY=true;
    const g=$('#gate');if(g)g.remove();$('#nav').classList.remove('hide');
    $('#who').textContent=(CAN.manage?'สิทธิ์: จัดการ':'สิทธิ์: ดูอย่างเดียว')+' · ขอบเขตข้อมูล: '+(CAN.all?'ทั้งหมด':'จำกัดตามที่ Super Admin กำหนด');
    show(V.cur);
  }catch(er){gate(`<h2 style="margin:0 0 8px">เชื่อมต่อไม่สำเร็จ</h2><div class="hint">${esc(errTxt(er))}</div><div style="margin-top:14px"><button class="btn pri" onclick="boot()">ลองใหม่</button></div>`)}
}
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lv=s=>{const m=String(s||'').match(/\d+/);return m?+m[0]:0};
const nl=s=>String(s||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
const fmt1=n=>n==null||isNaN(n)?'-':(Math.round(n*100)/100).toFixed(2);
const toISO=v=>{if(v==null||v==='')return '';if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  if(v instanceof Date)return v.toISOString().slice(0,10);return ''};
const yearsBetween=(iso,to=new Date())=>{if(!iso)return null;const d=new Date(iso+'T00:00:00Z');return (to-d)/(365.25*864e5)};
/* วันที่มีผลในไฟล์เป็นเลขลำดับวัน (serial) ที่ปีเป็น พ.ศ. อยู่ในช่องปี ค.ศ. เช่น 242554 = 24/2/2564 → แปลงเป็น วัน/เดือน/ปี พ.ศ. */
const effDate=v=>{if(v==null||v==='')return '';const s=String(v).trim();if(!/^\d{5,7}$/.test(s))return s;const d=new Date(Date.UTC(1899,11,30)+(+s)*864e5);if(isNaN(d))return s;return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${d.getUTCFullYear()}`};
/* อายุงานในตำแหน่งปัจจุบัน = นับจาก "วันที่มีผล" ของการปรับตำแหน่งครั้งล่าสุด (ถ้าไม่มีประวัติ นับจากวันเริ่มงาน) */
const beToISO=s=>{const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(effDate(s));return m?`${+m[3]-543}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:''};
const posSince=e=>{const ds=(e.hist||[]).map(h=>beToISO(h.date)).filter(Boolean).sort();return ds.length?{iso:ds[ds.length-1],src:'promo'}:{iso:e.start||'',src:'start'}};
const posTen=e=>{const s=posSince(e);return s.iso?`${ymd(s.iso)}${s.src==='start'?' *':''}`:'-'};
const ymd=(iso,noDay)=>{if(!iso)return '-';const a=new Date(iso+'T00:00:00Z'),b=new Date();let y=b.getUTCFullYear()-a.getUTCFullYear(),m=b.getUTCMonth()-a.getUTCMonth(),d=b.getUTCDate()-a.getUTCDate();if(d<0){m--;d+=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),0)).getUTCDate()}if(m<0){y--;m+=12}return `${y} ปี ${m} ด.`+(noDay?'':` ${d} ว.`)};
const orgLine=(e,sep)=>[[e.group,e.groupCode],[e.line,e.lineCode],[e.dept,e.deptCode],[e.section,'']].filter(x=>x[0]||x[1]).map(([n,c])=>esc(n)+(c?` <span class="hint">(${esc(c)})</span>`:'')).join(sep);
const thDate=iso=>{if(!iso)return '-';const [y,m,d]=iso.split('-');return `${d}/${m}/${+y+543}`};
const reqOf=l=>db.reqs.find(r=>r.level===l);
const empOf=id=>db.emps.find(e=>e.id===id);

/* ============ ประกาศแต่งตั้ง/เลื่อนตำแหน่ง (.docx) → เพิ่มเข้าประวัติการปรับตำแหน่ง ============ */
const stripTitle=s=>String(s||'').replace(/^\s*(ว่าที่\s*ร้อยตรี|ว่าที่\s*ร\.?\s*ต\.?|นางสาว|นาง|นาย|น\.\s*ส\.|นส\.|ดร\.|คุณ)\s*/,'');
const nname=s=>stripTitle(s).replace(/\s+/g,'');
/* จับคู่ด้วย "ชื่อ + นามสกุล" ต้องตรงกันทั้งคู่ (ตัดคำนำหน้าและช่องว่าง) — ไม่เดาจากชื่อต้นอย่างเดียว */
const fullKey=(first,last)=>nname(first)+String(last||'').replace(/\s+/g,'');
function matchEmp(name){const k=nname(name);if(!k)return{e:null,how:'ไม่มีชื่อ'};
  const c=db.emps.filter(e=>e.last&&fullKey(e.first,e.last)===k);   /* เทียบ ชื่อ+นามสกุล ติดกันไม่สนช่องว่าง/คำนำหน้า (ในประกาศบางชื่อไม่เว้นวรรคระหว่างชื่อกับนามสกุล) */
  return c.length===1?{e:c[0],how:'ชื่อ+นามสกุล'}:{e:null,how:c.length?'ชื่อ-นามสกุลซ้ำ '+c.length+' คน':'ไม่พบชื่อ+นามสกุลนี้'}}
function applyOrder(o){(o.entries||[]).forEach(en=>{const e=empOf(en.empId);if(!e)return;e.hist=e.hist||[];if(e.hist.some(h=>h.src==='order'&&h.order===o.no))return;
  e.hist.push({from:en.from,to:en.to,orgFrom:en.orgFrom,orgTo:en.orgTo,order:o.no,date:o.date,src:'order'});e.hist.sort((a,b)=>beToISO(a.date).localeCompare(beToISO(b.date)))})}
async function parseOrderDocx(buf){
  if(!window.JSZip)throw new Error('โหลดไลบรารีอ่านไฟล์ Word ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  const zip=await JSZip.loadAsync(buf),f=zip.file('word/document.xml');if(!f)throw new Error('ไม่ใช่ไฟล์ .docx');
  const doc=new DOMParser().parseFromString(await f.async('string'),'application/xml'),W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const kids=(el,n)=>[...el.childNodes].filter(x=>x.localName===n&&x.namespaceURI===W);
  const ptxt=p=>[...p.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('').replace(/\s+/g,' ').trim();
  const all=[...doc.getElementsByTagNameNS(W,'p')].map(ptxt).filter(Boolean);
  const no=((all.find(s=>/^ที่\s*\S+\/\d{4}/.test(s))||'').match(/ที่\s*(\S+\/\d{4})/)||[])[1]||'';
  const tbl=doc.getElementsByTagNameNS(W,'tbl')[0];if(!tbl)throw new Error('ไม่พบตารางรายชื่อในประกาศ');
  const cellLines=tc=>kids(tc,'p').map(ptxt).filter(Boolean);
  const val=(ls,key)=>{const l=ls.find(x=>x.replace(/\s+/g,'').startsWith(key.replace(/\s+/g,'')));if(!l)return '';const i=l.indexOf(':');return (i<0?'':l.slice(i+1)).trim().replace(/^[-–]$/,'')};
  const pc=ls=>{const acting=ls.some(x=>/^รักษาการ/.test(x)),en=(ls.find(x=>/^\(.*\)$/.test(x))||'').replace(/^\(|\)$/g,'');
    return{acting,pos:val(ls,'ตำแหน่ง'),en,level:val(ls,'ระดับตำแหน่ง'),group:val(ls,'กลุ่มงาน'),unit:val(ls,'สำนัก')||val(ls,'ฝ่าย')}};
  const out=[];let sec='',cur=null;
  kids(tbl,'tr').forEach(tr=>{const tcs=kids(tr,'tc');
    if(tcs.length===1){sec=cellLines(tcs[0]).join(' ');return}
    if(tcs.length<3)return;
    const nm=cellLines(tcs[0]).join(' ').trim();
    if(/^ชื่อ.*นามสกุล/.test(nm))return;
    const oldC=pc(cellLines(tcs[1])),newC=pc(cellLines(tcs[2]));
    if(!nm){if(cur&&newC.pos){cur.to+=(newC.acting?' และรักษาการ':' และ')+' '+newC.pos}return}
    cur={name:nm,from:oldC.pos+(oldC.level?` (ระดับ ${oldC.level})`:''),to:newC.pos+(newC.level?` (ระดับ ${newC.level})`:''),orgFrom:[oldC.unit,oldC.group].filter(Boolean).join(' / '),orgTo:[sec,newC.group].filter(Boolean).join(' / ')};out.push(cur)});
  return{no,people:out};
}
let ORD=null;
const beStr=iso=>{const [y,m,d]=iso.split('-');return `${d}/${m}/${+y+543}`};
/* ============ นำเข้าไฟล์ Excel ============ */
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:false});
  const sEmp=wb.Sheets['พนักงานปัจจุบัน']||wb.Sheets[wb.SheetNames[wb.SheetNames.length-1]];
  const sReq=wb.Sheets['ข้อกำหนด']||wb.Sheets[wb.SheetNames[0]];
  if(!sEmp)throw new Error('ไม่พบชีต "พนักงานปัจจุบัน"');
  const E=XLSX.utils.sheet_to_json(sEmp,{header:'A',defval:'',raw:true,blankrows:false});
  const emps=[];
  E.forEach(r=>{const id=String(r.B??'').trim();if(!/^\d{3,}$/.test(id))return;
    const g={};GRADE_YEARS.forEach((y,i)=>{const v=String(r['IJKLM'[i]]??'').trim();g[y]=GP[v]!=null?v:''});
    const hist=[['AS','AT','AU','AV','AW','AX'],['AY','AZ','BA','BB','BC','BD'],['BE','BF','BG','BH','BI','BJ']].map(c=>({from:String(r[c[0]]||''),to:String(r[c[1]]||''),orgFrom:String(r[c[2]]||''),orgTo:String(r[c[3]]||''),order:String(r[c[4]]||''),date:effDate(r[c[5]])})).filter(h=>h.from||h.to);
    emps.push({id,sex:r.C||'',name:(String(r.D||'').trim()+' '+String(r.E||'').trim()).trim(),first:String(r.D||'').trim(),last:String(r.E||'').trim(),nick:String(r.F||'').trim(),pos:String(r.G||'').trim(),level:lv(r.H),grades:g,
      reqLevel:lv(r.N),group:String(r.W||''),line:String(r.Y||''),dept:String(r.AA||''),deptCode:String(r.Z||''),groupCode:String(r.V||''),lineCode:String(r.X||''),section:String(r.AB||''),
      start:toISO(r.AC),birth:toISO(r.AG),
      edu:{lvl:String(r.AK||''),major:String(r.AL||''),inst:String(r.AM||''),year:String(r.AN||''),lvl0:String(r.AO||''),major0:String(r.AP||''),inst0:String(r.AQ||''),year0:String(r.AR||'')},hist})});
  const reqs=[];
  if(sReq){XLSX.utils.sheet_to_json(sReq,{header:'A',defval:'',raw:true,blankrows:false}).forEach(r=>{const l=lv(r.B);if(!/^Level\s*\d+/i.test(String(r.B||'')))return;
    reqs.push({level:l,posEn:nl(r.C),posTh:nl(r.D),qual:String(r.E||''),mission:String(r.F||''),auth:String(r.G||'')})})}
  if(!emps.length)throw new Error('ไม่พบข้อมูลพนักงาน (คอลัมน์ B ต้องเป็นรหัสพนักงาน เริ่มแถวที่ 4)');
  return{emps,reqs};
}
async function pushImport(r,name){
  if(!(CAN.manage&&CAN.all))throw new Error('ไม่มีสิทธิ์นำเข้า (ต้องมีสิทธิ์จัดการและขอบเขตข้อมูลทั้งหมด)');
  const {error}=await sb.rpc('promo_import',{p_emps:r.emps,p_reqs:r.reqs});if(error)throw error;
  const imp={at:new Date().toISOString(),file:name,n:r.emps.length};
  const c=await sb.from('promo_config').upsert({k:'imported',data:imp,updated_at:imp.at});if(c.error)throw c.error;
  const old=new Set(db.emps.map(e=>e.id));db.emps=r.emps;if(r.reqs.length)db.reqs=r.reqs;db.imported=imp;db.orders.forEach(applyOrder);
  return{emps:r.emps.length,reqs:r.reqs.length,added:r.emps.filter(e=>!old.has(e.id)).length};
}
const doImport=(buf,name)=>pushImport(parseWorkbook(buf),name);

function evalEmp(e){
  const c=db.cfg,gs=GRADE_YEARS.map(y=>({y,g:e.grades[y],p:GP[e.grades[y]]})).filter(x=>x.p!=null);
  const last=gs.slice(-c.gradeYears),avg=last.length?last.reduce((a,x)=>a+x.p,0)/last.length:null,min=last.length?Math.min(...last.map(x=>x.p)):null;
  const ten=yearsBetween(e.start),why=[];
  if(last.length<c.gradeYears)why.push(`มีเกรดไม่ครบ ${c.gradeYears} ปีล่าสุด (มี ${last.length} ปี)`);
  if(avg!=null&&avg<c.minAvg)why.push(`เกรดเฉลี่ย ${fmt1(avg)} < ${c.minAvg}`);
  if(min!=null&&min<c.minGrade)why.push(`มีเกรดต่ำกว่าเกณฑ์ขั้นต่ำ`);
  if(ten!=null&&ten<c.minTenure)why.push(`อายุงาน ${fmt1(ten)} ปี < ${c.minTenure} ปี`);
  if(e.level>=14)why.push('Level สูงสุดแล้ว');
  return{avg,min,ten,last,pass:!why.length,why};
}

function filteredEmps(){
  const f=V.emp,ev=new Map(db.emps.map(e=>[e.id,evalEmp(e)]));
  let a=db.emps.filter(e=>(!f.lv||e.level===+f.lv)&&(!f.dept||e.dept===f.dept)&&(!f.q||[e.id,e.name,e.nick,e.pos,e.dept].join(' ').toLowerCase().includes(f.q.toLowerCase()))
    &&(f.only===''||(f.only==='pass'?ev.get(e.id).pass:f.only==='fail'?!ev.get(e.id).pass:f.only==='nom'?!!activeNom(e.id):!activeNom(e.id))));
  const key={id:e=>e.id,name:e=>e.name,level:e=>e.level,avg:e=>ev.get(e.id).avg??-1,ten:e=>ev.get(e.id).ten??-1,dept:e=>e.dept,age:e=>yearsBetween(e.birth)??-1,pten:e=>yearsBetween(posSince(e).iso)??-1}[f.sort]||(e=>e.id);
  a.sort((x,y)=>{const p=key(x),q=key(y);return (typeof p==='number'?p-q:String(p).localeCompare(String(q),'th'))*f.dir});
  return{a,ev};
}

      $('#oapply').onclick=async()=>{const no=$('#ono').value.trim(),dt=$('#odt').value;if(!no||!dt)return alert('ระบุเลขที่ประกาศและวันที่มีผล');

        if(!confirm(`เพิ่มรายการในประวัติการปรับตำแหน่ง (จับคู่อัตโนมัติ ${ORD.ok.length} คน + เลือกเอง ${$$('[data-bm]').filter(s=>s.value).length} คน)\nประกาศ ${no} · มีผล ${beStr(dt)}`))return;
        const manual=$$('[data-bm]').map(s=>s.value?{...ORD.bad[+s.dataset.bm],empId:s.value}:null).filter(Boolean),ids=new Set(),list=[...ORD.ok,...manual].filter(x=>!ids.has(x.empId)&&ids.add(x.empId));
        const o={no,date:beStr(dt),entries:list.map(x=>({empId:x.empId,name:x.name,from:x.from,to:x.to,orgFrom:x.orgFrom,orgTo:x.orgTo})),at:new Date().toISOString()};
        const b=$('#oapply');b.disabled=true;b.textContent='กำลังบันทึก…';
        const r2=await sb.from('promo_config').upsert({k:'order:'+no,data:o,updated_at:o.at});if(r2.error){b.disabled=false;b.textContent='บันทึก';return alert('บันทึกไม่สำเร็จ: '+errTxt(r2.error))}
        db.emps.forEach(e=>{e.hist=(e.hist||[]).filter(h=>!(h.src==='order'&&h.order===no))});db.orders=db.orders.filter(x=>x.no!==no);db.orders.push(o);applyOrder(o);ORD=null;alert('บันทึกประวัติแล้ว');render()}}
    catch(er){pv.innerHTML=`<span style="color:var(--bad)">อ่านประกาศไม่สำเร็จ: ${esc(er.message)}</span>`}};
  $$('[data-odel]').forEach(b=>b.onclick=async()=>{const no=b.dataset.odel;if(!confirm(`ลบประกาศ ${no} ออกจากประวัติของทุกคน?`))return;
    const r=await sb.from('promo_config').delete().eq('k','order:'+no);if(r.error)return alert('ลบไม่สำเร็จ: '+errTxt(r.error));
    db.emps.forEach(e=>{e.hist=(e.hist||[]).filter(h=>!(h.src==='order'&&h.order===no))});db.orders=db.orders.filter(x=>x.no!==no);render()});  if(!(CAN.manage&&CAN.all)){['#fx','#cAvg','#cMin','#cYrs','#cTen','#cSave'].forEach(s=>$(s).disabled=true);$('#fmsg').insertAdjacentHTML('beforeend',' · <b>'+(CAN.manage?'ขอบเขตข้อมูลจำกัด':'สิทธิ์ดูอย่างเดียว')+' — นำเข้า/แก้เกณฑ์ไม่ได้</b>')}
  if($('#lgDel'))$('#lgDel').onclick=()=>{if(confirm('ลบข้อมูลเดิมที่ค้างในเบราว์เซอร์เครื่องนี้? (ไม่กระทบข้อมูลในระบบกลาง)')){localStorage.removeItem(KEY);render()}};
}
const legacyLocal=()=>{try{const s=localStorage.getItem(KEY);if(!s)return null;const o=JSON.parse(s);return(o.emps&&o.emps.length)||(o.noms&&o.noms.length)?{emps:o.emps||[],reqs:o.reqs||[],noms:o.noms||[]}:null}catch(_){return null}};
boot();
</script>
