.pf-wrap{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}@media(max-width:860px){.pf-wrap{grid-template-columns:1fr}.pf-nav{flex-direction:row!important;overflow-x:auto;position:static!important}.pf-nb{flex:0 0 auto}}
.pf-nav{position:sticky;top:150px;display:flex;flex-direction:column;gap:6px}.pf-nb{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}.pf-nb.on{border-color:var(--pri);background:#eef0ff}.pf-nb .ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eceefb;font-size:14px;flex:0 0 28px}.pf-nb.ok .ic{background:#d9f3ea;color:#087a5e;font-weight:700}

.tl-dot{flex:0 0 32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#eceefb;font-size:15px;z-index:1;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}.tl-item.done .tl-dot{background:var(--ok);color:#fff;font-weight:700}.tl-item.part .tl-dot{background:#e1e7ff;box-shadow:0 0 0 2px var(--pri)}.tl-item.on .tl-dot{box-shadow:0 0 0 3px var(--pri)}
.tl-main{flex:1;min-width:0}.tl-bar{display:block;height:6px;border-radius:4px;background:#e8eaf8;margin:4px 0;overflow:hidden}.tl-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok))}.tl-item.on .tl-main b{color:var(--pri)}
.pf-bar{height:10px;border-radius:6px;background:#e8eaf8;overflow:hidden}.pf-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--ok));transition:width .3s}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}.seg-b{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font:inherit;cursor:pointer;color:var(--ink)}.seg-b:hover{border-color:var(--pri)}.seg-b.on{background:var(--pri);color:#fff;border-color:var(--pri)}.seg-b:disabled{opacity:.6;cursor:default}.seg-n .seg-b{min-width:46px;text-align:center}.seg-c .seg-b{flex:1;min-width:150px;padding:12px 14px;text-align:center}
.hg{display:inline-block;animation:hgflip 3s ease-in-out infinite;transform-origin:50% 55%}
@keyframes hgflip{0%,42%{transform:rotate(0)}58%,92%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.wait-live{font-variant-numeric:tabular-nums}
.pf-two{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}.pf-two>div{flex:1 1 430px;min-width:290px}
.sigp{display:block;width:100%;max-width:440px;height:130px;border:1.5px dashed #aab0e0;border-radius:12px;background:#fff;touch-action:none;cursor:crosshair;margin:4px 0}
.pf-card{border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;background:#fff}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
@media print{header,nav,.noprint{display:none!important}}

<script>
/* ============ ข้อมูลและค่าตั้งต้น ============ */
const KEY='promo_v1';
const GP={'A+':4.3,'A':4.0,'A-':3.7,'B+':3.3,'B':3.0,'B-':2.7,'C+':2.3,'C':2.0,'C-':1.7,'D':1.0};
const STATUS=['ร่าง','เสนอแล้ว','ผ่านการพิจารณา','ไม่ผ่านการพิจารณา','ยกเลิก'];
const STCLS={'ร่าง':'','เสนอแล้ว':'pri','ผ่านการพิจารณา':'ok','ไม่ผ่านการพิจารณา':'bad','ยกเลิก':'warn'};
const GRADE_YEARS=['2564','2565','2566','2567','2568'];
const DEF={minAvg:3.0,minGrade:2.7,gradeYears:3,minTenure:1,yearBE:2569};
let db={emps:[],reqs:[],noms:[],orders:[],cfg:{...DEF},imported:null};
/* ============ ระบบกลาง (Supabase) — ใช้ session เดียวกับแอปหลัก ============ */
const SB_URL='https://vhhekmpkcqlgesojvlws.supabase.co',SB_KEY='sb_publishable_I5aGYPaJKemi6HP8Liijeg_Hb_M7-SQ';
let sb=null,CAN={view:false,manage:false,nom:false,all:true},READY=false;
try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}})}catch(_){}
const errTxt=e=>{const m=((e&&e.message)||String(e)).replace(/^[A-Z_]{3,}:/,'');return /promo_|can_promo|module_access/.test(m)&&/does not exist|schema cache|Could not find/.test(m)?m+' (ยังไม่ได้รัน supabase_update_hub49.sql)':/promo_nom_one_active|promo_nom_one_per_emp|duplicate key/.test(m)?'พนักงานแต่ละคนมีรายการเสนอชื่อได้รายการเดียว — พนักงานคนนี้มีรายการอยู่แล้ว':m};
function gate(h){$('#nav').classList.add('hide');$$('main>section').forEach(s=>s.classList.add('hide'));let g=$('#gate');if(!g){g=document.createElement('section');g.id='gate';$('main').appendChild(g)}g.innerHTML=`<div class="card" style="text-align:center;padding:34px 18px">${h}</div>`}
/* ============ ผลประเมิน Competency (Core / Managerial) ============ */
db.comp={};db.compYear=0;db.compItems=null;
async function loadComp(){db.comp={};db.compYear=0;db.compItems=null;
  try{const r=await sb.from('promo_competency').select('*').range(0,9999);if(r.error)return;const yrs=(r.data||[]).map(x=>x.year),y=yrs.length?Math.max(...yrs):0;db.compYear=y;(r.data||[]).filter(x=>x.year===y).forEach(x=>{db.comp[x.emp_id]=x.data});
    const c=await sb.from('promo_config').select('*').eq('k','competency_items');if(!c.error&&c.data&&c.data[0])db.compItems=c.data[0].data}catch(_){}}
const cTrunc=(s,n)=>{s=String(s||'');return s.length>n?s.slice(0,n-1)+'…':s};
const compCell=d=>d?`<b>${fmt1(d.score)}</b> <span class="gr ${gcls(d.grade)}">${esc(d.grade)}</span>`:'<span class="hint">-</span>';
function compBlock(e){
  const c=db.comp[e.id];
  if(!c)return `<h3 style="margin:16px 0 6px;font-size:15px">ผลประเมิน Competency</h3><div class="hint">${db.compYear?'ไม่มีผลประเมินของพนักงานคนนี้':'ยังไม่ได้นำเข้าผลประเมิน Competency'}</div>`;
  const blk=(k,title)=>{const d=c[k];if(!d)return `<div class="card" style="box-shadow:none;border:1px solid var(--line);margin:0"><b>${title}</b><div class="hint">ไม่มีผลประเมิน</div></div>`;
    const items=(db.compItems&&db.compItems[k])||[],avg=d.items.length?d.items.reduce((a,b)=>a+b,0)/d.items.length:null;
    return `<div class="card" style="box-shadow:none;border:1px solid var(--line);margin:0"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${title}</b><span><b style="font-size:22px">${fmt1(d.score)}</b> <span class="gr ${gcls(d.grade)}" style="font-size:14px">${esc(d.grade)}</span></span></div>
      <div class="hint">ผู้ประเมิน: ${esc(d.by.name)} · ${esc(d.by.pos)} (${esc(d.by.level)})</div>
      <details style="margin-top:8px"><summary style="cursor:pointer;color:var(--pri);font-weight:600">คะแนนรายข้อ (${d.items.length} ข้อ · เฉลี่ย ${fmt1(avg)} จาก 5)</summary>
        ${d.items.map((s,i)=>`<div class="bar" style="align-items:flex-start"><span style="flex:1;font-size:12px;line-height:1.4">${i+1}. ${esc(cTrunc(items[i]||'ข้อ '+(i+1),90))}</span><i style="width:${(s||0)/5*60}px;margin-top:4px"></i><b>${s??'-'}</b></div>`).join('')}</details></div>`};
  return `<h3 style="margin:16px 0 6px;font-size:15px">ผลประเมิน Competency ปี ${db.compYear}</h3><div class="grid g2">${blk('core','Core Competency')}${blk('managerial','Managerial Competency')}</div>`}
function parseCompetency(buf){
  if(!window.XLSX)throw new Error('โหลดไลบรารี Excel ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  const wb=XLSX.read(buf,{type:'array'}),map={core:'Core',managerial:'Managerial'},out={},heads={};
  const num=v=>{const m=String(v??'').match(/(\d+(?:\.\d+)?)/);return m?+m[1]:null},idOf=v=>{const s=String(v??'').trim();return /^\d+$/.test(s)&&s.length<5?s.padStart(5,'0'):s};
  const cols=['K','L','M','N','O','P','Q','R','S','T','U','V','W','X','Y'];let found=0;
  Object.entries(map).forEach(([k,nm])=>{const name=wb.SheetNames.find(s=>s.trim().toLowerCase()===nm.toLowerCase());if(!name)return;found++;
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:'A',defval:'',raw:true,blankrows:false});if(!rows.length)return;
    heads[k]=cols.map(c=>String(rows[0][c]||'').trim());
    rows.slice(1).forEach(r=>{const id=idOf(r.E);if(!id)return;const sc=+r.I;(out[id]=out[id]||{})[k]={score:isNaN(sc)?null:sc,grade:String(r.J||'').trim(),by:{id:idOf(r.A),name:String(r.B||'').trim(),pos:String(r.C||'').trim(),level:String(r.D||'').trim()},items:cols.map(c=>num(r[c]))}})});
  if(!found)throw new Error('ไม่พบชีต Core / Managerial');
  return{byEmp:out,heads};
}
async function compImport(buf,name,year){
  if(!(CAN.manage&&CAN.all))throw new Error('ต้องมีสิทธิ์จัดการและขอบเขตข้อมูลทั้งหมด');
  const r=parseCompetency(buf),ids=Object.keys(r.byEmp);if(!ids.length)throw new Error('ไม่พบข้อมูลผู้ถูกประเมิน');
  const known=new Set(db.emps.map(e=>e.id)),rows=ids.map(id=>({emp_id:id,year,data:r.byEmp[id],updated_at:new Date().toISOString()}));
  const d=await sb.from('promo_competency').delete().eq('year',year);if(d.error)throw d.error;
  for(let i=0;i<rows.length;i+=60){const ins=await sb.from('promo_competency').insert(rows.slice(i,i+60));if(ins.error)throw ins.error}
  const c1=await sb.from('promo_config').upsert({k:'competency_items',data:r.heads,updated_at:new Date().toISOString()});if(c1.error)throw c1.error;
  const c2=await sb.from('promo_config').upsert({k:'competency_meta',data:{file:name,year,at:new Date().toISOString(),n:ids.length},updated_at:new Date().toISOString()});if(c2.error)throw c2.error;
  await loadComp();return{n:ids.length,core:ids.filter(i=>r.byEmp[i].core).length,man:ids.filter(i=>r.byEmp[i].managerial).length,unmatched:ids.filter(i=>!known.has(i)).length};
}
/* ============ ประวัติการฝึกอบรม (นำเข้าจาก Excel รายบุคคล) ============ */
db.train={};
db.trCats=null;
async function loadTrain(){db.train={};db.trCats=null;try{const c=await sb.from('promo_config').select('*').eq('k','train_cats');if(!c.error&&c.data&&c.data[0]&&c.data[0].data&&Array.isArray(c.data[0].data.cats))db.trCats=c.data[0].data.cats}catch(_){}
  try{const r=await sb.from('promo_training').select('*').range(0,9999);if(r.error)return;(r.data||[]).forEach(x=>{db.train[x.emp_id]=x.rows||[]})}catch(_){}}
const trHours=a=>(a||[]).reduce((s,r)=>s+(+r.hrs||0),0);
/* หมวดหลักสูตร: จัดด้วยคำสำคัญในชื่อหลักสูตร (ไม่สนตัวพิมพ์เล็ก/ใหญ่) · ตรวจตามลำดับ ตรงหมวดแรกที่พบ · คำที่ขึ้นต้นด้วย = ต้องเป็นคำเต็ม (ตัวอักษรอังกฤษสั้น ๆ) · ผู้ดูแลแก้ไขได้ที่ นำเข้า/ตั้งค่า */

function parseTraining(buf){
  if(!window.XLSX)throw new Error('โหลดไลบรารี Excel ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:'A',defval:'',raw:true,blankrows:false});
  const nr=rows.find(r=>/^ชื่อ/.test(String(r.A||'').replace(/\s/g,''))&&String(r.B||'').trim());
  const name=nr?String(nr.B).trim():'';
  const hi=rows.findIndex(r=>String(r.B||'').includes('ชื่อหลักสูตร'));
  if(hi<0)throw new Error('ไม่พบหัวตาราง "ชื่อหลักสูตร"');
  const str=v=>String(v==null?'':v).replace(/\s+/g,' ').trim();
  const out=[];
  rows.slice(hi+1).forEach(r=>{const a=r.A,course=str(r.B);if(!course||!(typeof a==='number'||/^\d+$/.test(str(a))))return;
    let dt='',srt='';const c=r.C;
    if(typeof c==='number'&&c>20000){const p=XLSX.SSF.parse_date_code(c);if(p){const y=p.y>2400?p.y:p.y+543;dt=String(p.d).padStart(2,'0')+'/'+String(p.m).padStart(2,'0')+'/'+y;srt=''+y+String(p.m).padStart(2,'0')+String(p.d).padStart(2,'0')}}
    else{dt=str(c);const m=dt.match(/(\d{1,2})(?:\s*-\s*\d{1,2})?\s*\/\s*(\d{1,2})\s*\/\s*(\d{4})/);if(m){const y=+m[3]>2400?+m[3]:+m[3]+543;srt=''+y+m[2].padStart(2,'0')+m[1].padStart(2,'0')}}
    const h=parseFloat(String(r.D).replace(/,/g,''));
    out.push({course,date:dt,sort:srt,hrs:isNaN(h)?0:h,place:str(r.E),inst:str(r.F),speaker:str(r.G)})});
  return{name,rows:out};
}

function trMerge(existing,fresh,src){
  const kept=(existing||[]).filter(r=>(r.src||'xlsx')!==src),seen=new Set(kept.map(trKey)),add=[];
  fresh.forEach(r=>{const k=trKey(r);if(!seen.has(k)){seen.add(k);add.push({...r,src})}});
  return kept.concat(add)}

function parseEmpeoTraining(buf){
  if(!window.XLSX)throw new Error('โหลดไลบรารี Excel ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  const wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:'A',defval:'',raw:true,blankrows:false});
  const hi=rows.findIndex(r=>String(r.B||'').trim()==='รหัส'&&String(r.F||'').includes('ชื่อการอบรม'));
  if(hi<0)throw new Error('ไม่ใช่ไฟล์รายงานการอบรม (TRN002) — ไม่พบหัวตาราง รหัส / ชื่อการอบรม');
  const str=v=>String(v==null?'':v).replace(/\s+/g,' ').trim(),out=[];
  rows.slice(hi+1).forEach(r=>{const code=str(r.B),course=str(r.F),dtx=str(r.I);if(!/^\d+$/.test(code)||!course)return;
    if(str(r.N)&&str(r.N)!=='เสร็จสิ้น')return;
    const ds=dtx.match(/\d{2}\/\d{2}\/\d{4}/g)||[];if(!ds.length)return;
    const m=ds[0].match(/(\d{2})\/(\d{2})\/(\d{4})/),y=+m[3]>2400?+m[3]:+m[3]+543,sort=''+y+m[2]+m[1];
    const hm=dtx.match(/\(\s*(?:(\d+(?:\.\d+)?)\s*ชม\.?)?\s*(?:(\d+)\s*น\.?)?\s*\)/);
    const hrs=hm?(+(hm[1]||0)+(+(hm[2]||0))/60):0;
    out.push({code,name:str(r.C),course,date:ds.length>1&&ds[1]!==ds[0]?ds[0]+' - '+ds[1]:ds[0],sort,hrs:Math.round(hrs*100)/100,place:'',inst:str(r.J),speaker:str(r.H)})});
  return out}
async function empeoImport(file,onProg){

    if(!e){const m=matchEmp(r.name);e=m.e}
    if(!e){unmatched.set(r.code,r.name);return}
    (byId[e.id]=byId[e.id]||[]).push(r);total++});
  const ids=Object.keys(byId),now=new Date().toISOString();let added=0;
  for(let i=0;i<ids.length;i+=20){onProg&&onProg(Math.min(i+20,ids.length),ids.length);
    const batch=ids.slice(i,i+20).map(id=>{const before=(db.train[id]||[]).length,merged=trMerge(db.train[id],byId[id],'empeo');added+=merged.length-before;return{emp_id:id,rows:merged,src:'empeo',updated_at:now}});
    const r=await sb.from('promo_training').upsert(batch);if(r.error)throw r.error}
  await loadTrain();
  return{emps:ids.length,rows:total,added,unmatched:[...unmatched.entries()].map(([c,n])=>c+' '+n)}}
async function trainImport(files,onProg){
  if(!(CAN.manage&&CAN.all))throw new Error('ต้องมีสิทธิ์จัดการและขอบเขตข้อมูลทั้งหมด');

  $('#fmore').innerHTML=a.length>f.lim?`<button class="btn" id="fm">แสดงเพิ่ม (${a.length-f.lim} คน)</button>`:'';

/* ---- ฟอร์มเสนอชื่อ ---- */
/* ============ ตรวจคุณสมบัติตามข้อกำหนดตำแหน่งอัตโนมัติจากข้อมูลในระบบ ============ */
const EDU_RANK=[[/ป\.?\s*เอก|ปริญญาเอก/,7],[/ป\.?\s*โท|ปริญญาโท/,6],[/ป\.?\s*ตรี|ปริญญาตรี/,5],[/ปวส/,4],[/ปวช/,3],[/ม\.?\s*6|มัธยมศึกษาตอนปลาย/,2],[/ม\.?\s*3|มัธยมศึกษาตอนต้น/,1]];
const EDU_NAME={7:'ป.เอก',6:'ป.โท',5:'ป.ตรี',4:'ปวส.',3:'ปวช.',2:'ม.6',1:'ม.3',0:'-'};
const eduRankOf=s=>{const t=String(s||'');for(const [re,r] of EDU_RANK)if(re.test(t))return r;return 0};
const eduReqRank=s=>{const rs=EDU_RANK.filter(([re])=>re.test(s)).map(([,r])=>r);return rs.length?Math.min(...rs):0};
function autoQual(e,lines){
  const ten=yearsBetween(e.start)||0,sin=posSince(e),posY=yearsBetween(sin.iso)||0;
  const best=Math.max(eduRankOf(e.edu&&e.edu.lvl),eduRankOf(e.edu&&e.edu.lvl0));
  return lines.map(raw=>{const s=raw.replace(/^\s*[-•]\s*/,'');
    /* วุฒิการศึกษา */
    if(/วุฒิ|ปริญญา|ปวส|ปวช/.test(s)&&!/ประสบการณ์|ปี/.test(s.replace(/พ\.ศ\.|ปริญญา/g,''))){const need=eduReqRank(s);
      if(need)return best>=need?{state:'pass',note:`✓ ระบบตรวจ: วุฒิสูงสุด ${EDU_NAME[best]} (${[e.edu.lvl,e.edu.major].filter(Boolean).join(' ')}) ≥ ${EDU_NAME[need]} · สาขาให้ตรวจเอง`}:{state:'fail',note:`✗ ระบบตรวจ: วุฒิสูงสุด ${EDU_NAME[best]} ต่ำกว่า ${EDU_NAME[need]}`};
      return {state:'manual',note:'ต้องตรวจเอง'}}
    /* ประสบการณ์ / ระยะเวลา (ปี) */
    const lv=s.match(/ระดับ\s*(\d+)[^\d]{0,40}?(?:ไม่น้อยกว่า|อย่างน้อย|ตั้งแต่)\s*(\d+)\s*ปี/),conds=[];
    if(lv){const L7=+lv[1],yrs=+lv[2];conds.push({ok:e.level===L7?posY>=yrs:e.level>L7?null:false,txt:e.level===L7?`อยู่ในระดับ ${L7} มาแล้ว ${fmt1(posY)} ปี (ต้อง ≥ ${yrs} · ${sin.src==='start'?'นับจากวันเริ่มงานเพราะไม่มีประวัติปรับตำแหน่ง':'นับจากวันที่มีผลปรับตำแหน่งล่าสุด '+thDate(sin.iso)})`:`ปัจจุบันระดับ ${e.level} (ต้องเคยอยู่ระดับ ${L7} ≥ ${yrs} ปี — ตรวจจากประวัติเอง)`})}
    const rest=s.replace(lv?lv[0]:'','');[...rest.matchAll(/(?:ไม่น้อยกว่า|อย่างน้อย)\s*(\d+)\s*ปี/g)].forEach(m=>conds.push({ok:ten>=+m[1],txt:`อายุงานรวม ${fmt1(ten)} ปี (ต้อง ≥ ${m[1]})`}));
    if(conds.length){const okc=conds.filter(c=>c.ok===true),unk=conds.filter(c=>c.ok==null);
      if(okc.length)return {state:'pass',note:'✓ ระบบตรวจ: '+okc.map(c=>c.txt).join(' · ')};
      if(unk.length)return {state:'manual',note:'ต้องตรวจเอง: '+conds.map(c=>c.txt).join(' · ')};
      return {state:'fail',note:'✗ ระบบตรวจ: '+conds.map(c=>c.txt).join(' · ')}}
    return {state:'manual',note:'ต้องตรวจเอง'}})}
function openNom(id,editId){

  const x=evalEmp(e),to=ed?ed.toLevel:Math.min(14,e.level+1),r=reqOf(to);
  const items=r?r.qual.split(/\r?\n/).map(s=>s.trim()).filter(Boolean):[];
  const posList=r?r.posTh.map((p,i)=>[p,(r.posEn[i]||'')]):[];
  const lvOpts=[...new Set([...db.reqs.map(q=>q.level)])].filter(l=>l>e.level||ed&&l===ed.toLevel).sort((a,b)=>a-b);
  modal(`<div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="margin:0;font-size:19px">${ed?'แก้ไขการเสนอชื่อ':'เสนอชื่อปรับตำแหน่ง'}</h2><div class="hint">${esc(e.id)} ${esc(e.name)} · ${esc(e.pos)} · Level ${e.level} · ${esc(e.dept)}</div></div><button class="btn sm" onclick="closeModal()">✕</button></div>
  <div class="card" style="margin:14px 0;background:#f8f9ff;box-shadow:none"><b>ตรวจเกณฑ์เบื้องต้น:</b> เกรด ${gradeChips(e)} เฉลี่ย <b>${fmt1(x.avg)}</b> · อายุงาน ${x.ten==null?'-':fmt1(x.ten)+' ปี'} · วุฒิ ${esc(e.edu.lvl||'-')} ${esc(e.edu.major||'')}
    <div style="margin-top:6px">${x.pass?'<span class="tag ok">ผ่านเกณฑ์เบื้องต้น</span>':`<span class="tag bad">ยังไม่ผ่านเกณฑ์เบื้องต้น</span> <span class="hint">${esc(x.why.join(' · '))}</span>`}</div></div>
  <div class="row"><div><label>ปรับเป็น Level</label><select id="nmLv">${lvOpts.map(l=>`<option value="${l}" ${l===to?'selected':''}>Level ${l}</option>`).join('')}</select></div>
    <div style="flex:2"><label>ตำแหน่งที่เสนอ</label><select id="nmPos"></select></div></div>

async function pfGenPdf(n,e,d,opt){
  opt=opt||{};if(!(await loadHtml2Pdf()))throw new Error('โหลดไลบรารี PDF ไม่สำเร็จ (ตรวจสอบอินเทอร์เน็ต)');
  const comp=pfCompleteness(d,n,e),wrap=document.createElement('div'),el=document.createElement('div');wrap.style.cssText='position:fixed;left:-12000px;top:0;width:746px;pointer-events:none';el.style.cssText='width:746px;background:#fff';el.innerHTML=pfHtml(n,e,d,!comp.done);wrap.appendChild(el);document.body.appendChild(wrap);
  const name=`Promotion_Portfolio_${n.empId}_${new Date().toISOString().slice(0,10)}.pdf`;
  try{const job=html2pdf().set({margin:[10,8,12,8],filename:name,image:{type:'jpeg',quality:.95},html2canvas:{scale:2,useCORS:true,windowWidth:794,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['tr','h3']}}).from(el);
    if(opt.blob)return await job.outputPdf('blob');await job.save()}finally{wrap.remove()}
}

        if(!confirm(`เพิ่มรายการในประวัติการปรับตำแหน่ง (จับคู่อัตโนมัติ ${ORD.ok.length} คน + เลือกเอง ${$$('[data-bm]').filter(s=>s.value).length} คน)\nประกาศ ${no} · มีผล ${beStr(dt)}`))return;
        const manual=$$('[data-bm]').map(s=>s.value?{...ORD.bad[+s.dataset.bm],empId:s.value}:null).filter(Boolean),ids=new Set(),list=[...ORD.ok,...manual].filter(x=>!ids.has(x.empId)&&ids.add(x.empId));
        const o={no,date:beStr(dt),entries:list.map(x=>({empId:x.empId,name:x.name,from:x.from,to:x.to,orgFrom:x.orgFrom,orgTo:x.orgTo})),at:new Date().toISOString()};
        const b=$('#oapply');b.disabled=true;b.textContent='กำลังบันทึก…';
        const r2=await sb.from('promo_config').upsert({k:'order:'+no,data:o,updated_at:o.at});if(r2.error){b.disabled=false;b.textContent='บันทึก';return alert('บันทึกไม่สำเร็จ: '+errTxt(r2.error))}
        db.emps.forEach(e=>{e.hist=(e.hist||[]).filter(h=>!(h.src==='order'&&h.order===no))});db.orders=db.orders.filter(x=>x.no!==no);db.orders.push(o);applyOrder(o);ORD=null;alert('บันทึกประวัติแล้ว');render()}}
    catch(er){pv.innerHTML=`<span style="color:var(--bad)">อ่านประกาศไม่สำเร็จ: ${esc(er.message)}</span>`}};
  $$('[data-odel]').forEach(b=>b.onclick=async()=>{const no=b.dataset.odel;if(!confirm(`ลบประกาศ ${no} ออกจากประวัติของทุกคน?`))return;
    const r=await sb.from('promo_config').delete().eq('k','order:'+no);if(r.error)return alert('ลบไม่สำเร็จ: '+errTxt(r.error));
    db.emps.forEach(e=>{e.hist=(e.hist||[]).filter(h=>!(h.src==='order'&&h.order===no))});db.orders=db.orders.filter(x=>x.no!==no);render()});  if(!(CAN.manage&&CAN.all)){['#fx','#cAvg','#cMin','#cYrs','#cTen','#cSave'].forEach(s=>$(s).disabled=true);$('#fmsg').insertAdjacentHTML('beforeend',' · <b>'+(CAN.manage?'ขอบเขตข้อมูลจำกัด':'สิทธิ์ดูอย่างเดียว')+' — นำเข้า/แก้เกณฑ์ไม่ได้</b>')}
  if($('#lgDel'))$('#lgDel').onclick=()=>{if(confirm('ลบข้อมูลเดิมที่ค้างในเบราว์เซอร์เครื่องนี้? (ไม่กระทบข้อมูลในระบบกลาง)')){localStorage.removeItem(KEY);render()}};
}
const legacyLocal=()=>{try{const s=localStorage.getItem(KEY);if(!s)return null;const o=JSON.parse(s);return(o.emps&&o.emps.length)||(o.noms&&o.noms.length)?{emps:o.emps||[],reqs:o.reqs||[],noms:o.noms||[]}:null}catch(_){return null}};
boot();
</script>
