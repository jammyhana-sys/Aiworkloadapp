<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ติดตั้งไอคอน Dynamic Work Sync V.1.0.1</title>
<meta name="theme-color" content="#4f6df5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{--bg:#eef3fb;--card:#fff;--ink:#1f2a44;--mut:#6a7a93;--pri:#4f6df5;--pri2:#7a5cf0;--ok:#14a37f}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1524;--card:#18203a;--ink:#e8edf8;--mut:#9aa9c4}}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px 40px;text-align:center}
  .wrap{max-width:420px;margin:0 auto}
  img.logo{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 22px rgba(79,109,245,.35)}
  h1{font-size:22px;margin:14px 0 18px}
  .step{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:16px;margin:12px 0;text-align:left;box-shadow:0 4px 16px rgba(40,60,120,.08);font-size:18px;font-weight:600}
  .n{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
  .ico{font-size:28px;margin-left:auto}
  .btn{display:block;width:100%;border:0;border-radius:18px;padding:20px 16px;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2));text-decoration:none;font-family:inherit;margin-top:16px;cursor:pointer}
  .btn.ok{background:var(--ok)}
  .sub{color:var(--mut);font-size:14px;margin-top:10px}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="icon-192.png" alt="Dynamic Work Sync V.1.0.1">
  <h1>ติดตั้งไอคอนบนหน้าจอ</h1>

  <!-- เปิดใน LINE: ปุ่มเดียว -->
  <div id="lineBox" class="hide">
    <div class="step"><span class="n">1</span><span>กดปุ่มด้านล่าง</span><span class="ico">👇</span></div>
    <a id="extBtn" class="btn" href="#">🌐 เปิดด้วยเบราว์เซอร์</a>
    <div class="sub">แล้วทำตามขั้นตอนที่ขึ้นในหน้าถัดไป</div>
  </div>

  <!-- Android: ปุ่มเดียว (ถ้าไม่พร้อม แสดง 3 ขั้นตอน) -->
  <div id="android" class="hide">
    <button id="instBtn" class="btn hide">📲 ติดตั้งไอคอน</button>
    <div id="androidManual">
      <div class="step"><span class="n">1</span><span>กดเมนู <b>⋮</b> มุมขวาบน</span><span class="ico">⋮</span></div>
      <div class="step"><span class="n">2</span><span>กด <b>ติดตั้งแอป</b><br><small style="font-weight:400">(หรือ เพิ่มลงในหน้าจอหลัก)</small></span><span class="ico">📲</span></div>
      <div class="step"><span class="n">3</span><span>กด <b>ติดตั้ง</b></span><span class="ico">✅</span></div>
    </div>
  </div>

  <!-- iPhone: 3 ขั้นตอน -->
  <div id="ios" class="hide">
    <div class="step"><span class="n">1</span><span>กดปุ่ม <b>แชร์</b><br><small style="font-weight:400">(ใน Safari)</small></span><span class="ico">⬆️</span></div>
    <div class="step"><span class="n">2</span><span>กด <b>เพิ่มไปยังหน้าจอโฮม</b></span><span class="ico">➕</span></div>
    <div class="step"><span class="n">3</span><span>กด <b>เพิ่ม</b></span><span class="ico">✅</span></div>
  </div>

  <div id="doneBox" class="hide">
    <div class="step"><span class="n">✓</span><span>ติดตั้งแล้ว</span></div>
    <a class="btn ok" href="./">เปิดแอป</a>
  </div>
</div>

<script>
(function(){
  const ua=navigator.userAgent||'',$=id=>document.getElementById(id),show=id=>$(id).classList.remove('hide'),hide=id=>$(id).classList.add('hide');
  const inLine=/Line\//i.test(ua),ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/i.test(ua)&&navigator.maxTouchPoints>1),android=/Android/i.test(ua);
  const standalone=window.matchMedia&&matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(standalone){show('doneBox');return}
  if(inLine){   // ใน LINE ติดตั้งไม่ได้ → เปิดด้วยเบราว์เซอร์ก่อน (พารามิเตอร์ของ LINE)
    const u=new URL(location.href);u.searchParams.set('openExternalBrowser','1');$('extBtn').href=u.toString();show('lineBox');return}
  if(ios)show('ios');else show('android');
  let dp=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;show('instBtn');hide('androidManual')});
  $('instBtn').onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(_){}dp=null;hide('instBtn');show('androidManual')};
  window.addEventListener('appinstalled',()=>{['android','ios'].forEach(hide);show('doneBox')});
  if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
